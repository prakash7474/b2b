[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
excludepath = tests/test_vendor_inventory_precise.py
addopts = -ra -q --tb=short
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = .
omit =
    tests/*
    .expo/*
    node_modules/*
    .kilo/*
    retrain_models.py

[coverage:report]
show_missing = true
precision = 1
# Raise this gate as coverage grows (target >50 after step-3 edge tests land).
fail_under = 0
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__
    raise NotImplementedError
