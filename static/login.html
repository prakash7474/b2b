<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2P — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1a1a2e}
.login-container{width:420px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.login-header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:32px;text-align:center;color:#fff}
.login-header h1{font-size:28px;font-weight:800;margin-bottom:4px}
.login-header h1 span{color:#4ecca3}
.login-header p{font-size:13px;color:rgba(255,255,255,.6)}
.login-body{padding:32px}
.role-tabs{display:flex;gap:4px;margin-bottom:24px;background:#f0f2f5;border-radius:10px;padding:4px}
.role-tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:#888;transition:.2s;border:none;background:transparent}
.role-tab.active{background:#fff;color:#1a1a2e;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;transition:.2s;background:#fafafa}
.form-group input:focus{outline:none;border-color:#4ecca3;background:#fff;box-shadow:0 0 0 3px rgba(78,204,163,.15)}
.login-btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;background:linear-gradient(135deg,#4ecca3,#38b28a);color:#fff;margin-top:8px}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(78,204,163,.4)}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.error-msg{margin-top:12px;padding:10px;border-radius:8px;background:#fce4ec;color:#c62828;font-size:13px;display:none;text-align:center}
.error-msg.show{display:block}
.hint{margin-top:20px;text-align:center;font-size:12px;color:#aaa}
.hint code{background:#f0f2f5;padding:2px 8px;border-radius:4px;font-size:11px}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <h1>B2P <span>Platform</span></h1>
    <p>Batter-to-Plate ML Prediction System</p>
  </div>
  <div class="login-body">
    <div class="role-tabs">
      <button class="role-tab active" onclick="switchRole('admin')">🔑 Admin</button>
      <button class="role-tab" onclick="switchRole('vendor')">🏪 Vendor</button>
    </div>

    <!-- Admin Login -->
    <div id="admin-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="admin-user" placeholder="admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="admin-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>

    <!-- Vendor Login -->
    <div id="vendor-form" style="display:none">
      <div class="form-group">
        <label>Vendor ID</label>
        <input type="text" id="vendor-id" placeholder="e.g. V100">
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Sign In</button>

    <div class="hint">
      Admin: <code>admin</code> / <code>admin123</code><br>
      Vendor: enter your Vendor ID (e.g. <code>V100</code>)
    </div>
  </div>
</div>

<script>
let currentRole = 'admin';

function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.role-tab')[role === 'admin' ? 0 : 1].classList.add('active');
  document.getElementById('admin-form').style.display = role === 'admin' ? 'block' : 'none';
  document.getElementById('vendor-form').style.display = role === 'vendor' ? 'block' : 'none';
  document.getElementById('error-msg').className = 'error-msg';
}

async function doLogin() {
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  errEl.className = 'error-msg';

  try {
    let body;
    if (currentRole === 'admin') {
      body = {
        role: 'admin',
        username: document.getElementById('admin-user').value,
        password: document.getElementById('admin-pass').value,
      };
    } else {
      body = {
        role: 'vendor',
        vendor_id: document.getElementById('vendor-id').value,
      };
    }

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.error || 'Login failed';
      errEl.className = 'error-msg show';
      return;
    }

    if (data.role === 'admin') {
      window.location.href = '/';
    } else {
      window.location.href = '/vendor';
    }
  } catch(e) {
    errEl.textContent = 'Connection error';
    errEl.className = 'error-msg show';
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
}

// Enter key to submit
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
