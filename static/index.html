<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2P — Admin Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6f9;--sidebar:#1a1a2e;--sidebar-active:#16213e;--accent:#4ecca3;--text:#1a1a2e;--muted:#888;--card:#fff;--border:#e8eaed;--danger:#e74c3c;--warn:#f39c12;--success:#27ae60;--info:#3498db}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar);color:#fff;position:fixed;height:100vh;overflow-y:auto;z-index:100}
.sidebar .logo{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.08);font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sidebar .logo span{color:var(--accent)}
.sidebar .logout-sm{background:rgba(255,255,255,.1);color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 24px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px;font-weight:500;transition:.2s;border-left:3px solid transparent}
.sidebar nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar nav a.active{background:var(--sidebar-active);color:var(--accent);border-left-color:var(--accent)}
.sidebar nav a .icon{width:20px;text-align:center;font-size:16px}
.sidebar .nav-divider{height:1px;background:rgba(255,255,255,.08);margin:8px 24px}
.sidebar .nav-section{padding:8px 24px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.3);font-weight:700}
.main{margin-left:240px;flex:1;min-height:100vh}
.topbar{background:var(--card);padding:16px 32px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.topbar h2{font-size:18px;font-weight:700}
.topbar .db-badge{font-size:11px;padding:4px 12px;border-radius:20px;background:var(--accent);color:#fff;font-weight:600}
.content{padding:28px 32px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid var(--border)}
.stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card .value{font-size:28px;font-weight:800;margin-top:4px}
.stat-card .sub{font-size:11px;color:var(--muted);margin-top:2px}
.stat-card.green .value{color:var(--success)}
.stat-card.blue .value{color:var(--info)}
.stat-card.orange .value{color:var(--warn)}
.stat-card.red .value{color:var(--danger)}
.stat-card.purple .value{color:#9c27b0}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:20px}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-header h3{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:#f8f9fa;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border)}
tr:hover td{background:#f8fffd}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-created{background:#e3f2fd;color:#1565c0}
.badge-assigned{background:#fff8e1;color:#f57f17}
.badge-received{background:#e8f5e9;color:#2e7d32}
.badge-demand{background:#e3f2fd;color:#1976d2}
.badge-spoilage{background:#fff3e0;color:#e65100}
.badge-low{background:#e8f5e9;color:#2e7d32}
.badge-medium{background:#fff8e1;color:#f57f17}
.badge-high{background:#fce4ec;color:#c62828}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.form-grid.cols-2{grid-template-columns:1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;transition:.2s;background:#fafafa;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(78,204,163,.12)}
.form-group textarea{min-height:60px;resize:vertical}
.btn{padding:10px 28px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:linear-gradient(135deg,#4ecca3,#38b28a);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(78,204,163,.35)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff;padding:5px 14px;font-size:12px;border-radius:6px}
.btn-sm{padding:6px 16px;font-size:12px}
.btn-info{background:var(--info);color:#fff}
.ml-box{background:linear-gradient(135deg,#f8fffe,#e8f8f0);border:2px solid var(--accent);border-radius:12px;padding:24px;margin-bottom:20px}
.ml-box h4{color:var(--accent);font-size:15px;margin-bottom:12px}
.ml-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.ml-item{text-align:center}
.ml-item .ml-val{font-size:28px;font-weight:800}
.ml-item .ml-label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.result-box{margin-top:20px;padding:20px;border-radius:10px;background:#f8fffe;border:1.5px solid #c8e6d8;display:none}
.result-box.show{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.result-title{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.result-item{text-align:center}
.result-value{font-size:24px;font-weight:700}
.result-label{font-size:11px;color:var(--muted);margin-top:2px}
.error-box{margin-top:16px;padding:14px;border-radius:8px;background:#fce4ec;color:#c62828;font-size:13px;display:none}
.error-box.show{display:block}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;z-index:300;animation:slideUp .3s ease}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:12px;width:500px;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative}
.modal h3{margin-bottom:16px;font-size:18px}
.modal .close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)}
.freshness-bar{height:8px;border-radius:4px;background:#eee;overflow:hidden;margin-top:4px}
.freshness-fill{height:100%;border-radius:4px;transition:width .3s}
.freshness-low{background:var(--success)}
.freshness-medium{background:var(--warn)}
.freshness-high{background:var(--danger)}
.filters{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
.loading{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:900px){.sidebar{width:60px}.sidebar .logo span,.sidebar nav a span,.sidebar .nav-section{display:none}.sidebar nav a{justify-content:center;padding:12px}.main{margin-left:60px}.stats-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">B2P <span>Admin</span> <button class="logout-sm" onclick="logout()">Logout</button></div>
  <nav>
    <a href="#" onclick="go('dashboard')" class="active" id="nav-dashboard"><span class="icon">📊</span> <span>Dashboard</span></a>
    <div class="nav-divider"></div>
    <div class="nav-section">Operations</div>
    <a href="#" onclick="go('batches')" id="nav-batches"><span class="icon">📦</span> <span>Batches</span></a>
    <a href="#" onclick="go('vendors')" id="nav-vendors"><span class="icon">🏪</span> <span>Vendors</span></a>
    <a href="#" onclick="go('inventory')" id="nav-inventory"><span class="icon">📋</span> <span>Inventory</span></a>
    <div class="nav-divider"></div>
    <div class="nav-section">ML Tools</div>
    <a href="#" onclick="go('predictions')" id="nav-predictions"><span class="icon">🤖</span> <span>AI Predictions</span></a>
    <a href="#" onclick="go('demand')" id="nav-demand"><span class="icon">📈</span> <span>Demand Forecast</span></a>
    <a href="#" onclick="go('spoilage')" id="nav-spoilage"><span class="icon">⚠️</span> <span>Spoilage Risk</span></a>
    <a href="#" onclick="go('history')" id="nav-history"><span class="icon">📜</span> <span>Prediction History</span></a>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <h2 id="page-title">Dashboard</h2>
    <div class="db-badge" id="db-status">Connecting...</div>
  </div>
  <div class="content" id="content"><div class="loading">Loading...</div></div>
</div>

<div id="modal-container"></div>

<script>
const API = '';
let currentPage = 'dashboard';

function toast(msg, type='success') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
}
async function api(endpoint) { const r = await fetch(API + endpoint); if (r.status === 401 || r.redirected) { window.location.href = '/login'; return null; } return r.json(); }
async function apiPost(endpoint, body) {
  const r = await fetch(API + endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const data = await r.json(); if (!r.ok) throw new Error(data.error || 'Request failed'); return data;
}
async function apiPut(endpoint, body) {
  const r = await fetch(API + endpoint, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const data = await r.json(); if (!r.ok) throw new Error(data.error || 'Failed'); return data;
}
async function apiDelete(endpoint) { return fetch(API + endpoint, {method:'DELETE'}).then(r=>r.json()); }
function fmtDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function fmtShort(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function statusBadge(s) { return `<span class="badge badge-${s}">${s}</span>`; }
function freshnessBar(score) {
  const cls = score < 0.3 ? 'freshness-low' : score <= 0.7 ? 'freshness-medium' : 'freshness-high';
  return `<div class="freshness-bar"><div class="freshness-fill ${cls}" style="width:${Math.min(100,score*100)}%"></div></div>`;
}
async function logout() { await fetch('/api/logout',{method:'POST'}); window.location.href='/login'; }

function go(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
  const nav = document.getElementById('nav-' + page); if (nav) nav.classList.add('active');
  document.getElementById('modal-container').innerHTML = '';
  const titles = {dashboard:'Dashboard',batches:'Batches',vendors:'Vendors',inventory:'Inventory',predictions:'AI Predictions',demand:'Demand Forecast',spoilage:'Spoilage Risk',history:'Prediction History'};
  document.getElementById('page-title').textContent = titles[page] || page;
  const loaders = {dashboard:loadDashboard,batches:loadBatches,vendors:loadVendors,inventory:loadInventory,predictions:loadPredictions,demand:loadDemandForm,spoilage:loadSpoilageForm,history:loadHistory};
  if (loaders[page]) loaders[page]();
}

// ═══ DASHBOARD ═══
async function loadDashboard() {
  const d = await api('/api/dashboard'); if (!d) return;
  document.getElementById('content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card blue"><div class="label">Vendors</div><div class="value">${d.totalVendors}</div></div>
      <div class="stat-card orange"><div class="label">Total Batches</div><div class="value">${d.totalBatches}</div><div class="sub">${d.assignedBatches} assigned, ${d.receivedBatches} received</div></div>
      <div class="stat-card green"><div class="label">Inventory</div><div class="value">${d.totalInventoryItems}</div><div class="sub">${d.totalStockQuantity} units</div></div>
      <div class="stat-card red"><div class="label">Low Stock</div><div class="value">${d.lowStockItems}</div><div class="sub">${d.highFreshnessRisk} high spoilage risk</div></div>
    </div>
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card purple"><div class="label">Total Predictions</div><div class="value">${d.totalPredictions}</div></div>
      <div class="stat-card orange"><div class="label">Pending Orders</div><div class="value">${d.pendingOrders}</div></div>
      <div class="stat-card blue"><div class="label">Inventory Items</div><div class="value">${d.totalInventoryItems}</div></div>
    </div>
    <div class="card" style="padding:20px">
      <h3 style="margin-bottom:12px">Quick Actions</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="go('batches')">📦 Create Batch</button>
        <button class="btn btn-info btn-sm" onclick="go('predictions')">🤖 Run ML Predictions</button>
        <button class="btn btn-sm" style="background:#f39c12;color:#fff" onclick="go('demand')">📈 Demand Forecast</button>
      </div>
    </div>
  `;
}

// ═══ BATCHES ═══
async function loadBatches() {
  const [batches, vendors] = await Promise.all([api('/api/batches'), api('/api/vendors')]);
  if (!batches) return;
  document.getElementById('content').innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:20px">
      <button class="btn btn-primary btn-sm" onclick="showCreateBatch()">+ Create New Batch</button>
    </div>
    <div class="card">
      <div class="card-header"><h3>All Batches (${batches.length})</h3></div>
      <table>
        <thead><tr><th>Batch ID</th><th>Product</th><th>Volume</th><th>pH</th><th>Temp</th><th>Manufactured</th><th>Vendor</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${batches.map(b => `<tr>
            <td><strong>${b.batch_id}</strong></td>
            <td>${b.product_name}</td>
            <td>${b.volume_kg} kg</td>
            <td>${b.initialPH}</td>
            <td>${b.temperatureC}°C</td>
            <td>${fmtShort(b.mfg_timestamp)}</td>
            <td>${b.vendor_id ? (b.vendor_name || b.vendor_id) : '<span style="color:#aaa">—</span>'}</td>
            <td>${statusBadge(b.status)}</td>
            <td>
              ${b.status === 'created' ? `<button class="btn btn-sm btn-primary" onclick="showAssignModal('${b.batch_id}')">Assign</button>` : ''}
              ${b.status === 'received' ? `<button class="btn btn-sm btn-info" onclick="showSpoilageForBatch('${b.batch_id}')">ML Risk</button>` : ''}
              <button class="btn btn-sm btn-danger" onclick="deleteBatch('${b.batch_id}')">Delete</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function showCreateBatch() {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <button class="close" onclick="this.closest('.modal-overlay').remove()">x</button>
        <h3>Create New Batch</h3>
        <div class="form-grid cols-2" style="margin-top:16px">
          <div class="form-group"><label>Batch ID</label><input id="cb-id" placeholder="B30000"></div>
          <div class="form-group"><label>Product</label>
            <select id="cb-product"><option>Idli Batter</option><option>Dosa Batter</option><option>Combo Pack</option><option>Rava Batter</option></select>
          </div>
          <div class="form-group"><label>Manufacturer</label><input id="cb-mfr" value="B2P Central Kitchen"></div>
          <div class="form-group"><label>Batch Number</label><input id="cb-num" placeholder="Auto from ID"></div>
          <div class="form-group"><label>Volume (kg)</label><input type="number" id="cb-vol" value="5" step="0.5"></div>
          <div class="form-group"><label>Initial pH</label><input type="number" id="cb-ph" value="4.4" step="0.01"></div>
          <div class="form-group"><label>Temperature (°C)</label><input type="number" id="cb-temp" value="28" step="0.5"></div>
          <div class="form-group"><label>Humidity (%)</label><input type="number" id="cb-hum" value="55" step="1"></div>
          <div class="form-group"><label>Fermentation (hrs)</label><input type="number" id="cb-ferm" value="8" step="0.5"></div>
          <div class="form-group" style="grid-column:span 2"><label>Notes</label><textarea id="cb-notes" placeholder="Optional notes about this batch..."></textarea></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="btn btn-sm" style="background:#f0f2f5;color:#555" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="createBatch()">Create Batch</button>
        </div>
      </div>
    </div>
  `;
}

async function createBatch() {
  try {
    const id = document.getElementById('cb-id').value.trim();
    if (!id) { toast('Batch ID is required', 'error'); return; }
    await apiPost('/api/batches', {
      batch_id: id,
      product_name: document.getElementById('cb-product').value,
      manufacturer: document.getElementById('cb-mfr').value,
      batch_number: document.getElementById('cb-num').value || id,
      volume_kg: document.getElementById('cb-vol').value,
      initialPH: document.getElementById('cb-ph').value,
      temperatureC: document.getElementById('cb-temp').value,
      humidityPct: document.getElementById('cb-hum').value,
      fermentationHours: document.getElementById('cb-ferm').value,
      notes: document.getElementById('cb-notes').value,
    });
    document.getElementById('modal-container').innerHTML = '';
    toast('Batch ' + id + ' created!');
    loadBatches();
  } catch(e) { toast(e.message, 'error'); }
}

function showAssignModal(batchId) {
  api('/api/vendors').then(vendors => {
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
        <div class="modal">
          <button class="close" onclick="this.closest('.modal-overlay').remove()">x</button>
          <h3>Assign Batch ${batchId}</h3>
          <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Select a vendor to deliver this batch to:</p>
          <div class="form-group">
            <label>Vendor</label>
            <select id="assign-vendor">
              ${vendors.map(v => `<option value="${v.vendor_id}">${v.shop_name} (${v.vendor_id}) — ${v.address || ''}</option>`).join('')}
            </select>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
            <button class="btn btn-sm" style="background:#f0f2f5;color:#555" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="btn btn-primary btn-sm" onclick="assignBatch('${batchId}')">Assign</button>
          </div>
        </div>
      </div>
    `;
  });
}

async function assignBatch(batchId) {
  try {
    const vendorId = document.getElementById('assign-vendor').value;
    const result = await apiPut('/api/batches/' + batchId + '/assign', {vendor_id: vendorId});
    document.getElementById('modal-container').innerHTML = '';
    toast('Batch assigned to ' + (result.vendor_name || vendorId) + '!');
    loadBatches();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteBatch(batchId) {
  if (!confirm('Delete batch ' + batchId + '?')) return;
  try { await apiDelete('/api/batches/' + batchId); toast('Batch deleted'); loadBatches(); }
  catch(e) { toast(e.message, 'error'); }
}

// ═══ VENDORS ═══
async function loadVendors() {
  const vendors = await api('/api/vendors'); if (!vendors) return;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-header"><h3>Vendors (${vendors.length})</h3></div>
      <table>
        <thead><tr><th>ID</th><th>Shop</th><th>Owner</th><th>Phone</th><th>Address</th><th>Rating</th><th>Fridge</th><th>Batches</th></tr></thead>
        <tbody>
          ${vendors.map(v => `<tr>
            <td><strong>${v.vendor_id}</strong></td>
            <td>${v.shop_name}</td>
            <td>${v.owner_name}</td>
            <td>${v.phone}</td>
            <td>${v.address}</td>
            <td>⭐ ${v.rating}</td>
            <td>${v.hasRefrigerator ? '✅' : '❌'}</td>
            <td>${v.received_count}/${v.batch_count} received</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ═══ INVENTORY ═══
async function loadInventory() {
  const items = await api('/api/inventory'); if (!items) return;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <table>
        <thead><tr><th>ID</th><th>Vendor</th><th>Product</th><th>Batch</th><th>Qty</th><th>Price</th><th>Mfg</th><th>Expiry</th><th>Freshness</th></tr></thead>
        <tbody>
          ${items.map(i => {
            const fs = i.freshness_score || 0;
            return `<tr>
              <td>${i.inventory_id}</td><td>${i.vendor_name || i.vendor_id}</td>
              <td><strong>${i.product_name}</strong></td><td>${i.batch_number}</td>
              <td>${i.quantity}</td><td>₹${i.price}</td>
              <td>${fmtShort(i.manufacture_date)}</td><td>${fmtShort(i.expiry_date)}</td>
              <td>${(fs*100).toFixed(0)}% ${freshnessBar(fs)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

          </tr>`).join('')}

      </table>
    </div>

async function runForecast(vendorId, btn) {
  btn.textContent = 'Loading...'; btn.disabled = true;
  try {
    // Auto-derive features from real order/inventory data
    const result = await api('/api/vendors/' + vendorId + '/demand-forecast');
    if (!result) return;
    const tr = btn.closest('tr');
    tr.innerHTML = `<td>${vendorId}</td><td>${result.shopName}</td>
      <td>
        <strong style="color:var(--accent);font-size:16px">${result.predictedDemand}</strong> units
        → dispatch <strong>${result.recommendedDispatch}</strong>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          Lag1: ${result.lag1} | Lag7: ${result.lag7} | Rolling7: ${result.rolling7DayMean} | SameSlot4wk: ${result.sameSlot4WeekMean} | Trend: ${result.recentTrend}
        </div>
      </td>`;
  } catch(e) { btn.textContent = 'Error'; toast(e.message, 'error'); }
}

async function showSpoilageForBatch(batchId) {
  const d = await api('/api/batches/' + batchId + '/predict-spoilage');
  if (!d) return;
  const riskCls = d.mlRiskLabel === 'Low' ? 'badge-low' : d.mlRiskLabel === 'Medium' ? 'badge-medium' : 'badge-high';
  const fsCls = d.freshnessRisk === 'Low' ? 'badge-low' : d.freshnessRisk === 'Medium' ? 'badge-medium' : 'badge-high';
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <button class="close" onclick="this.closest('.modal-overlay').remove()">x</button>
        <h3>Spoilage Risk — ${d.productId}</h3>
        <div class="ml-box">
          <div class="ml-grid">
            <div class="ml-item"><div class="ml-val"><span class="badge ${riskCls}" style="font-size:18px;padding:6px 16px">${d.mlRiskLabel}</span></div><div class="ml-label">ML Risk Level</div></div>
            <div class="ml-item"><div class="ml-val">${d.mlConfidence}%</div><div class="ml-label">Confidence</div></div>
            <div class="ml-item"><div class="ml-val"><span class="badge ${fsCls}" style="font-size:14px;padding:4px 12px">${(d.freshnessScore*100).toFixed(0)}%</span></div><div class="ml-label">Freshness</div></div>
          </div>
          <div style="margin-top:12px">${Object.entries(d.mlProbabilities).map(([k,v])=>`<span class="badge badge-${k.toLowerCase()}" style="margin:2px">${k}: ${v}%</span>`).join('')}</div>
        </div>
        <div style="margin-top:12px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
            <div><span style="color:var(--muted)">Hours since mfg:</span> <strong>${d.hoursSinceManufacture}h</strong></div>
            <div><span style="color:var(--muted)">Hours to expiry:</span> <strong>${d.hoursToExpiry}h</strong></div>
            <div><span style="color:var(--muted)">Sell-through rate:</span> <strong>${(d.sellThroughRate*100).toFixed(0)}%</strong></div>
            <div><span style="color:var(--muted)">Vendor:</span> <strong>${d.vendorName || d.vendorId}</strong></div>
          </div>
          <div style="margin-top:8px;font-size:11px;color:var(--muted)">Source: ${d.dataSource}</div>
        </div>
      </div>
    </div>
  `;
}

  document.getElementById('content').innerHTML = `
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="stat-card blue"><div class="label">Total</div><div class="value">${stats.totalPredictions}</div></div>
      <div class="stat-card green"><div class="label">Demand</div><div class="value">${stats.demandPredictions}</div></div>
      <div class="stat-card orange"><div class="label">Spoilage</div><div class="value">${stats.spoilagePredictions}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>Predictions</h3></div>
      <table>
        <thead><tr><th>Time</th><th>Type</th><th>Vendor</th><th>Product</th><th>Result</th></tr></thead>
        <tbody>
          ${history.length ? history.map(h => {
            const badge = h.predictionType === 'DEMAND' ? '<span class="badge badge-demand">DEMAND</span>' : '<span class="badge badge-spoilage">SPOILAGE</span>';

        </tbody>
      </table>

  `;
}
