<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2P — Vendor Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#fff;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:20px;font-weight:700}
header h1 span{color:#4ecca3}
.header-right{display:flex;align-items:center;gap:16px}
.vendor-name{font-size:13px;color:rgba(255,255,255,.7)}
.logout-btn{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.logout-btn:hover{background:rgba(255,255,255,.25)}
.container{max-width:1000px;margin:0 auto;padding:24px 32px}
.welcome{background:linear-gradient(135deg,#4ecca3,#38b28a);color:#fff;border-radius:12px;padding:24px;margin-bottom:24px}
.welcome h2{font-size:22px;margin-bottom:4px}
.welcome p{font-size:13px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #e8eaed;text-align:center}
.stat-card .num{font-size:24px;font-weight:800}
.stat-card .lbl{font-size:10px;color:#888;text-transform:uppercase;margin-top:2px}
.stat-card.assigned .num{color:#f39c12}
.stat-card.received .num{color:#27ae60}
.stat-card.total .num{color:#1a1a2e}
.stat-card.demand .num{color:#3498db}
.card{background:#fff;border-radius:12px;border:1px solid #e8eaed;overflow:hidden;margin-bottom:20px}
.card-header{padding:14px 20px;border-bottom:1px solid #e8eaed;display:flex;justify-content:space-between;align-items:center}
.card-header h3{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:#f8f9fa;color:#888;font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:2px solid #e8eaed}
td{padding:10px 14px;border-bottom:1px solid #eee}
tr:hover td{background:#f8fffd}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-assigned{background:#fff8e1;color:#f57f17}
.badge-received{background:#e8f5e9;color:#2e7d32}
.badge-low{background:#e8f5e9;color:#2e7d32}
.badge-medium{background:#fff8e1;color:#f57f17}
.badge-high{background:#fce4ec;color:#c62828}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.btn-receive{background:linear-gradient(135deg,#4ecca3,#38b28a);color:#fff}
.btn-receive:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(78,204,163,.35)}
.btn-ml{background:#3498db;color:#fff}
.btn-ml:hover{background:#2980b9}
.btn-done{background:#e8f5e9;color:#2e7d32;cursor:default}
.ml-box{background:linear-gradient(135deg,#f8fffe,#e8f8f0);border:2px solid #4ecca3;border-radius:12px;padding:20px;margin:16px 0}
.ml-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;text-align:center}
.ml-item .ml-val{font-size:22px;font-weight:800}
.ml-item .ml-label{font-size:10px;color:#888;text-transform:uppercase;margin-top:2px}
.demand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.demand-item{text-align:center;background:#f8f9fa;border-radius:8px;padding:12px}
.demand-item .val{font-size:20px;font-weight:800;color:#1a1a2e}
.demand-item .lbl{font-size:10px;color:#888;text-transform:uppercase;margin-top:2px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;z-index:1000;animation:slideUp .3s ease}
.toast.success{background:#27ae60}
.toast.error{background:#e74c3c}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;width:520px;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative}
.modal h3{margin-bottom:12px;font-size:18px}
.modal .close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:20px;cursor:pointer;color:#888}
.modal textarea{width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;resize:vertical;min-height:60px;font-family:inherit}
.modal textarea:focus{outline:none;border-color:#4ecca3}
.modal .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal .btn-cancel{background:#f0f2f5;color:#555}
.empty{text-align:center;padding:40px;color:#bbb;font-size:14px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}.ml-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
  <h1>B2P <span>Vendor Portal</span></h1>
  <div class="header-right">
    <span class="vendor-name" id="vendor-name">Loading...</span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">
  <div class="welcome" id="welcome">
    <h2>Welcome!</h2>
    <p>View your assigned batches, check spoilage risk, and confirm receipt.</p>
  </div>

  <div class="stats" id="stats-bar">
    <div class="stat-card assigned"><div class="num" id="stat-assigned">-</div><div class="lbl">Awaiting Receipt</div></div>
    <div class="stat-card received"><div class="num" id="stat-received">-</div><div class="lbl">Received</div></div>
    <div class="stat-card total"><div class="num" id="stat-total">-</div><div class="lbl">Total Batches</div></div>
    <div class="stat-card demand"><div class="num" id="stat-demand">-</div><div class="lbl">Predicted Demand</div></div>
  </div>

  <!-- Demand Forecast Section -->
  <div class="card" id="demand-section">
    <div class="card-header"><h3>📈 Demand Forecast (Auto-computed from your sales history)</h3></div>
    <div id="demand-content" style="padding:20px"><div class="empty">Loading forecast...</div></div>
  </div>

  <!-- Batches Section -->
  <div class="card">
    <div class="card-header"><h3>📦 Your Batches</h3></div>
    <div id="batch-list"><div class="empty">Loading...</div></div>
  </div>
</div>

<div id="modal-container"></div>

<script>
const API = '';
let vendorId = '';
let batches = [];

function toast(msg, type='success') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
}
function fmtDate(d) {
  if (!d) return '-';
  return new Date(d).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}) + ' ' +
    new Date(d).toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'});
}
async function logout() {
  await fetch('/api/logout', {method: 'POST'});
  window.location.href = '/login';
}

// ═══ LOAD ALL DATA ═══
async function loadData() {
  try {
    const me = await fetch('/api/me').then(r => r.json());
    if (!me.loggedIn || me.role !== 'vendor') { window.location.href = '/login'; return; }

    vendorId = me.vendor_id;
    document.getElementById('vendor-name').textContent = me.shop_name + ' (' + me.vendor_id + ')';
    document.getElementById('welcome').querySelector('h2').textContent = 'Welcome, ' + me.shop_name + '!';

    // Load batches and demand forecast in parallel
    const [batchesData, forecastData] = await Promise.all([
      fetch(API + '/api/batches?vendor_id=' + vendorId).then(r => r.json()),
      fetch(API + '/api/vendors/' + vendorId + '/demand-forecast').then(r => r.json()),
    ]);

    batches = batchesData;

    // Update stats
    const assigned = batches.filter(b => b.status === 'assigned').length;
    const received = batches.filter(b => b.status === 'received').length;
    document.getElementById('stat-assigned').textContent = assigned;
    document.getElementById('stat-received').textContent = received;
    document.getElementById('stat-total').textContent = batches.length;
    document.getElementById('stat-demand').textContent = forecastData.predictedDemand || '-';

    // Render demand forecast
    renderDemandForecast(forecastData);

    // Render batches with ML risk
    renderBatches();

  } catch(e) {
    console.error(e);
    window.location.href = '/login';
  }
}

// ═══ DEMAND FORECAST ═══
function renderDemandForecast(d) {
  if (d.error) {
    document.getElementById('demand-content').innerHTML = '<div class="empty">No sales history yet. Forecast will appear after orders are placed.</div>';
    return;
  }
  document.getElementById('demand-content').innerHTML = `
    <div class="ml-box">
      <div class="ml-grid">
        <div class="ml-item"><div class="ml-val" style="color:#3498db">${d.predictedDemand}</div><div class="ml-label">Predicted Demand</div></div>
        <div class="ml-item"><div class="ml-val" style="color:#e67e22">${d.recommendedDispatch}</div><div class="ml-label">Recommended Dispatch</div></div>
        <div class="ml-item"><div class="ml-val">${d.currentStock}</div><div class="ml-label">Current Stock</div></div>
        <div class="ml-item"><div class="ml-val">${d.minimumStock}</div><div class="ml-label">Minimum Stock</div></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px">
      <div class="demand-item"><div class="val">${d.lag1}</div><div class="lbl">Lag 1 (prev window)</div></div>
      <div class="demand-item"><div class="val">${d.lag7}</div><div class="lbl">Lag 7 (same day last wk)</div></div>
      <div class="demand-item"><div class="val">${d.rolling7DayMean}</div><div class="lbl">Rolling 7-Day Avg</div></div>
      <div class="demand-item"><div class="val">${d.sameSlot4WeekMean}</div><div class="lbl">Same Slot 4-Week Avg</div></div>
      <div class="demand-item"><div class="val">${d.recentTrend}</div><div class="lbl">Recent Trend</div></div>
      <div class="demand-item"><div class="val">${d.recentOrders}</div><div class="lbl">Recent Orders</div></div>
    </div>
    <div style="margin-top:12px;font-size:11px;color:#888">Source: ${d.dataSource}</div>
  `;
}

// ═══ BATCHES ═══
function renderBatches() {
  const el = document.getElementById('batch-list');
  if (!batches.length) {
    el.innerHTML = '<div class="empty">No batches assigned to you yet.</div>';
    return;
  }

  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Batch ID</th><th>Product</th><th>Vol</th><th>pH</th><th>Temp</th>
        <th>Humidity</th><th>Ferment</th><th>Manufactured</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${batches.map(b => `<tr>
          <td><strong>${b.batch_id}</strong></td>
          <td>${b.product_name}</td>
          <td>${b.volume_kg}kg</td>
          <td>${b.initialPH}</td>
          <td>${b.temperatureC}°C</td>
          <td>${b.humidityPct}%</td>
          <td>${b.fermentationHours}h</td>
          <td>${fmtDate(b.mfg_timestamp)}</td>
          <td>${b.status === 'received'
            ? '<span class="badge badge-received">✓ Received</span>'
            : '<span class="badge badge-assigned">Awaiting Receipt</span>'
          }</td>
          <td style="white-space:nowrap">
            ${b.status === 'assigned'
              ? `<button class="btn btn-receive" onclick="showReceiveModal('${b.batch_id}')">Confirm</button>
                 <button class="btn btn-ml" onclick="showBatchSpoilage('${b.batch_id}')">ML Risk</button>`
              : `<button class="btn btn-ml" onclick="showBatchSpoilage('${b.batch_id}')">ML Risk</button>`
            }
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}

// ═══ RECEIVE MODAL ═══
function showReceiveModal(batchId) {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <button class="close" onclick="this.closest('.modal-overlay').remove()">x</button>
        <h3>Confirm Receipt — ${batchId}</h3>
        <p style="font-size:13px;color:#888;margin-bottom:16px">I confirm that this batch has been received and inspected.</p>
        <div style="margin-bottom:12px">
          <label style="font-size:12px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.5px">Notes (optional)</label>
          <textarea id="receive-notes" placeholder="e.g., Good quality, delivered on time, packaging okay..."></textarea>
        </div>
        <div class="btn-row">
          <button class="btn btn-cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-receive" onclick="confirmReceive('${batchId}')">✓ Confirm Receipt</button>
        </div>
      </div>
    </div>
  `;
}

async function confirmReceive(batchId) {
  const notes = document.getElementById('receive-notes').value;
  try {
    const res = await fetch(API + '/api/batches/' + batchId + '/receive', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({notes}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    document.getElementById('modal-container').innerHTML = '';
    toast('Batch ' + batchId + ' received! Inventory updated.');
    loadData(); // Reload all data
  } catch(e) { toast(e.message, 'error'); }
}

// ═══ ML SPOILAGE RISK ═══
async function showBatchSpoilage(batchId) {
  try {
    const d = await fetch(API + '/api/batches/' + batchId + '/predict-spoilage').then(r => r.json());
    if (d.error) { toast(d.error, 'error'); return; }

    const riskCls = d.mlRiskLabel === 'Low' ? 'badge-low' : d.mlRiskLabel === 'Medium' ? 'badge-medium' : 'badge-high';
    const fsCls = d.freshnessRisk === 'Low' ? 'badge-low' : d.freshnessRisk === 'Medium' ? 'badge-medium' : 'badge-high';

    document.getElementById('modal-container').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
        <div class="modal" style="width:550px">
          <button class="close" onclick="this.closest('.modal-overlay').remove()">x</button>
          <h3>🤖 ML Spoilage Risk — ${d.productId}</h3>

          <div class="ml-box">
            <div class="ml-grid">
              <div class="ml-item"><div class="ml-val"><span class="badge ${riskCls}" style="font-size:16px;padding:6px 16px">${d.mlRiskLabel}</span></div><div class="ml-label">Risk Level</div></div>
              <div class="ml-item"><div class="ml-val">${d.mlConfidence}%</div><div class="ml-label">Confidence</div></div>
              <div class="ml-item"><div class="ml-val"><span class="badge ${fsCls}" style="font-size:14px;padding:4px 12px">${(d.freshnessScore*100).toFixed(0)}%</span></div><div class="ml-label">Freshness</div></div>
            </div>
            <div style="margin-top:12px;text-align:center">
              ${Object.entries(d.mlProbabilities).map(([k,v])=>`<span class="badge badge-${k.toLowerCase()}" style="margin:2px">${k}: ${v}%</span>`).join('')}
            </div>
          </div>

          <div style="margin-top:16px">
            <h4 style="font-size:13px;color:#4ecca3;margin-bottom:8px">Batch Parameters</h4>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">
              <div><span style="color:#888">Hours since manufacture:</span> <strong>${d.hoursSinceManufacture}h</strong></div>
              <div><span style="color:#888">Hours to expiry:</span> <strong>${d.hoursToExpiry}h</strong></div>
              <div><span style="color:#888">Sell-through rate:</span> <strong>${(d.sellThroughRate*100).toFixed(0)}%</strong></div>
              <div><span style="color:#888">Vendor:</span> <strong>${d.vendorName || d.vendorId}</strong></div>
            </div>
          </div>

          <div style="margin-top:16px">
            <h4 style="font-size:13px;color:#4ecca3;margin-bottom:8px">What this means</h4>
            <div style="font-size:12px;color:#555;line-height:1.6">
              ${d.mlRiskLabel === 'Low' ? '✅ <strong>Low risk.</strong> This batch is fresh and safe to sell. Standard shelf-life tracking applies.' :
                d.mlRiskLabel === 'Medium' ? '⚠️ <strong>Medium risk.</strong> Consider selling this batch soon. Push notifications to customers may help.' :
                '🔴 <strong>High risk.</strong> This batch should be prioritized for immediate sale or flash discount. Quality may degrade quickly.'}
            </div>
          </div>

          <div style="margin-top:12px;font-size:11px;color:#888">Source: ${d.dataSource}</div>
        </div>
      </div>
    `;
  } catch(e) { toast('Error loading ML prediction', 'error'); }
}

// ═══ INIT ═══
loadData();
</script>
</body>
</html>
