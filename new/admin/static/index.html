<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2P Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6f9;--sidebar:#1a1a2e;--sidebar-active:#16213e;--accent:#4ecca3;--accent2:#38b28a;--text:#1a1a2e;--muted:#888;--card:#fff;--border:#e8eaed;--danger:#e74c3c;--warn:#f39c12;--success:#27ae60;--info:#3498db}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

/* ── Sidebar ── */
.sidebar{width:240px;background:var(--sidebar);color:#fff;padding:0;position:fixed;height:100vh;overflow-y:auto;z-index:100}
.sidebar .logo{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.08);font-size:18px;font-weight:700}
.sidebar .logo span{color:var(--accent)}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 24px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px;font-weight:500;transition:.2s;border-left:3px solid transparent}
.sidebar nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar nav a.active{background:var(--sidebar-active);color:var(--accent);border-left-color:var(--accent)}
.sidebar nav a .icon{width:20px;text-align:center;font-size:16px}
.sidebar .sidebar-footer{position:absolute;bottom:0;width:100%;padding:16px 24px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.35)}

/* ── Main ── */
.main{margin-left:240px;flex:1;min-height:100vh}
.topbar{background:var(--card);padding:16px 32px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.topbar h2{font-size:18px;font-weight:700}
.topbar .db-badge{font-size:11px;padding:4px 12px;border-radius:20px;background:var(--accent);color:#fff;font-weight:600}
.content{padding:28px 32px}

/* ── Cards ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid var(--border)}
.stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card .value{font-size:28px;font-weight:800;margin-top:4px}
.stat-card .sub{font-size:11px;color:var(--muted);margin-top:2px}
.stat-card.green .value{color:var(--success)}
.stat-card.blue .value{color:var(--info)}
.stat-card.orange .value{color:var(--warn)}
.stat-card.red .value{color:var(--danger)}
.stat-card.purple .value{color:#9c27b0}

/* ── Table ── */
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:20px}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-header h3{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:#f8f9fa;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border)}
tr:hover td{background:#f8fffd}

/* ── Badges ── */
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-verified{background:#e8f5e9;color:#2e7d32}
.badge-pending{background:#fff8e1;color:#f57f17}
.badge-rejected{background:#fce4ec;color:#c62828}
.badge-paid{background:#e8f5e9;color:#2e7d32}
.badge-unpaid{background:#fff3e0;color:#e65100}
.badge-delivered{background:#e3f2fd;color:#1565c0}
.badge-active{background:#fce4ec;color:#c62828}
.badge-acknowledged{background:#fff8e1;color:#f57f17}
.badge-resolved{background:#e8f5e9;color:#2e7d32}
.badge-low{background:#e8f5e9;color:#2e7d32}
.badge-medium{background:#fff8e1;color:#f57f17}
.badge-high{background:#fce4ec;color:#c62828}
.badge-info{background:#e3f2fd;color:#1565c0}

/* ── Vendor Grid ── */
.vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.vendor-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px;cursor:pointer;transition:.2s}
.vendor-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:var(--accent)}
.vendor-card h4{font-size:16px;font-weight:700;margin-bottom:8px}
.vendor-card .meta{font-size:13px;color:var(--muted);margin-bottom:4px}
.vendor-card .rating{color:var(--warn);font-weight:700}
.vendor-card .coords{font-size:11px;color:var(--muted);font-family:monospace}

/* ── Detail Page ── */
.back-btn{background:none;border:none;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.back-btn:hover{text-decoration:underline}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.detail-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px}
.detail-card h4{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.detail-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #f5f5f5}
.detail-row:last-child{border:none}
.detail-row .label{color:var(--muted)}
.detail-row .val{font-weight:600}

/* ── Freshness bar ── */
.freshness-bar{height:8px;border-radius:4px;background:#eee;overflow:hidden;margin-top:4px}
.freshness-fill{height:100%;border-radius:4px;transition:width .3s}
.freshness-low{background:var(--success)}
.freshness-medium{background:var(--warn)}
.freshness-high{background:var(--danger)}

/* ── ML Prediction ── */
.ml-box{background:linear-gradient(135deg,#f8fffe,#e8f8f0);border:2px solid var(--accent);border-radius:12px;padding:24px;margin-bottom:20px}
.ml-box h4{color:var(--accent);font-size:15px;margin-bottom:12px}
.ml-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.ml-item{text-align:center}
.ml-item .ml-val{font-size:32px;font-weight:800;color:var(--text)}
.ml-item .ml-label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.ml-item.risk-low .ml-val{color:var(--success)}
.ml-item.risk-medium .ml-val{color:var(--warn)}
.ml-item.risk-high .ml-val{color:var(--danger)}

/* ── Filters ── */
.filters{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--accent)}

/* ── Order detail modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:12px;width:600px;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;font-size:18px}
.modal .close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)}

/* ── Loading ── */
.loading{text-align:center;padding:40px;color:var(--muted)}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;z-index:300;animation:slideUp .3s ease}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){
  .sidebar{width:60px}.sidebar .logo span,.sidebar nav a span{display:none}.sidebar nav a{justify-content:center;padding:12px}
  .main{margin-left:60px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .detail-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">B2P <span>Admin</span></div>
  <nav>
    <a href="#" onclick="go('dashboard')" class="active" id="nav-dashboard"><span class="icon">📊</span> <span>Dashboard</span></a>
    <a href="#" onclick="go('vendors')" id="nav-vendors"><span class="icon">🏪</span> <span>Vendors</span></a>
    <a href="#" onclick="go('orders')" id="nav-orders"><span class="icon">📦</span> <span>Orders</span></a>
    <a href="#" onclick="go('inventory')" id="nav-inventory"><span class="icon">📋</span> <span>Inventory</span></a>
    <a href="#" onclick="go('alerts')" id="nav-alerts"><span class="icon">🔔</span> <span>Alerts</span></a>
    <a href="#" onclick="go('predictions')" id="nav-predictions"><span class="icon">🤖</span> <span>AI Predictions</span></a>
    <a href="#" onclick="go('recommendations')" id="nav-recommendations"><span class="icon">⭐</span> <span>Recommendations</span></a>
  </nav>
  <div class="sidebar-footer">B2P Admin v1.0</div>
</aside>

<div class="main">
  <div class="topbar">
    <h2 id="page-title">Dashboard</h2>
    <div class="db-badge" id="db-status">Connecting...</div>
  </div>
  <div class="content" id="content">
    <div class="loading">Loading...</div>
  </div>
</div>

<div id="modal-container"></div>

<script>
const API = '';
let currentPage = 'dashboard';
let vendorCache = [];

// ── Helpers ──
async function api(endpoint) { const r = await fetch(API + endpoint); return r.json(); }
function toast(msg, type='success') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
}
function fmt(d) { if (!d) return '-'; const dt = new Date(d); return dt.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}) + ' ' + dt.toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}); }
function statusBadge(s) { return `<span class="badge badge-${s}">${s}</span>`; }

async function verifyVendor(vendorId, action) {
  try {
    await api_put('/api/vendors/' + vendorId + '/verify', { action: action });
    toast('Vendor ' + (action === 'verify' ? 'confirmed' : 'rejected') + '!');
    if (currentPage === 'vendors') loadVendors();
    if (currentPage === 'vendor-detail') loadVendorDetail(vendorId);
  } catch(e) { toast(e.message, 'error'); }
}

async function api_put(endpoint, body) {
  const r = await fetch(API + endpoint, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Failed');
  return data;
}
function freshnessBadge(score) {
  if (score < 0.3) return '<span class="badge badge-low">Low Risk</span>';
  if (score <= 0.7) return '<span class="badge badge-medium">Medium Risk</span>';
  return '<span class="badge badge-high">High Risk</span>';
}
function freshnessBar(score) {
  const cls = score < 0.3 ? 'freshness-low' : score <= 0.7 ? 'freshness-medium' : 'freshness-high';
  return `<div class="freshness-bar"><div class="freshness-fill ${cls}" style="width:${Math.min(100,score*100)}%"></div></div>`;
}

// ── Navigation ──
function go(page, params) {
  currentPage = page;
  document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
  const nav = document.getElementById('nav-' + page);
  if (nav) nav.classList.add('active');
  document.getElementById('modal-container').innerHTML = '';

  const titles = { dashboard:'Dashboard', vendors:'Vendors', orders:'Orders', inventory:'Inventory', alerts:'Alerts', predictions:'AI Predictions', recommendations:'Recommendations', 'vendor-detail':'Vendor Details' };
  document.getElementById('page-title').textContent = titles[page] || 'Dashboard';

  const loaders = { dashboard: loadDashboard, vendors: loadVendors, orders: loadOrders, inventory: loadInventory, alerts: loadAlerts, predictions: loadPredictions, recommendations: loadRecommendations, 'vendor-detail': () => loadVendorDetail(params) };
  if (loaders[page]) loaders[page]();
}

// ════════════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════════════
async function loadDashboard() {
  const d = await api('/api/dashboard');
  document.getElementById('content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card blue"><div class="label">Total Vendors</div><div class="value">${d.totalVendors}</div><div class="sub">${d.verifiedVendors} verified</div></div>
      <div class="stat-card green"><div class="label">Inventory Items</div><div class="value">${d.totalInventoryItems}</div><div class="sub">${d.totalStockQuantity} total units</div></div>
      <div class="stat-card orange"><div class="label">Total Orders</div><div class="value">${d.totalOrders}</div><div class="sub">${d.pendingOrders} pending</div></div>
      <div class="stat-card red"><div class="label">Low Stock Items</div><div class="value">${d.lowStockItems}</div><div class="sub">${d.highFreshnessRisk} high spoilage risk</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card purple"><div class="label">Active Alerts</div><div class="value">${d.activeAlerts}</div><div class="sub">Requires attention</div></div>
      <div class="stat-card green"><div class="label">Verified Vendors</div><div class="value">${d.verifiedVendors}</div><div class="sub">of ${d.totalVendors} total</div></div>
      <div class="stat-card blue"><div class="label">Pending Orders</div><div class="value">${d.pendingOrders}</div><div class="sub">To be fulfilled</div></div>
      <div class="stat-card red"><div class="label">Spoilage Risk</div><div class="value">${d.highFreshnessRisk}</div><div class="sub">Freshness > 0.7</div></div>
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════
// VENDORS
// ════════════════════════════════════════════════════════════════
async function loadVendors() {
  vendorCache = await api('/api/vendors');
  document.getElementById('content').innerHTML = `
    <div class="vendor-grid" id="vendor-grid">
      ${vendorCache.map(v => `
        <div class="vendor-card" onclick="go('vendor-detail','${v.vendor_id}')">
          <h4>${v.shop_name}</h4>
          <div class="meta">Owner: ${v.owner_name} | Rating: <span class="rating">${v.rating}</span></div>
          <div class="meta">${statusBadge(v.verification_status)}</div>
          <div class="meta" style="margin-top:8px">Phone: ${v.phone}</div>
          <div class="meta">Email: ${v.email}</div>
          <div class="meta">Address: ${v.address}</div>
          <div class="coords">${v.latitude}, ${v.longitude}</div>
          ${v.verification_status === 'pending' ? `<div style="margin-top:12px;display:flex;gap:8px">
            <button class="btn btn-sm" style="background:var(--success);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600" onclick="event.stopPropagation();verifyVendor('${v.vendor_id}','verify')">Confirm</button>
            <button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600" onclick="event.stopPropagation();verifyVendor('${v.vendor_id}','reject')">Reject</button>
          </div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════
// VENDOR DETAIL
// ════════════════════════════════════════════════════════════════
async function loadVendorDetail(vendorId) {
  if (!vendorId) { go('vendors'); return; }
  const [vendor, inventory, orders, forecast] = await Promise.all([
    api('/api/vendors/' + vendorId),
    api('/api/vendors/' + vendorId + '/inventory'),
    api('/api/vendors/' + vendorId + '/orders'),
    api('/api/vendors/' + vendorId + '/demand-forecast'),
  ]);

  // Load order items for each delivery order
  const ordersWithItems = await Promise.all(orders.map(async (o) => {
    const detail = await api('/api/orders/' + o.order_id);
    return { ...o, items: detail.items || [] };
  }));

  document.getElementById('page-title').textContent = vendor.shop_name;
  document.getElementById('content').innerHTML = `
    <button class="back-btn" onclick="go('vendors')">← Back to Vendors</button>

    <div class="detail-grid">
      <div class="detail-card">
        <h4>Vendor Information</h4>
        <div class="detail-row"><span class="label">Shop Name</span><span class="val">${vendor.shop_name}</span></div>
        <div class="detail-row"><span class="label">Owner</span><span class="val">${vendor.owner_name}</span></div>
        <div class="detail-row"><span class="label">Phone</span><span class="val">${vendor.phone}</span></div>
        <div class="detail-row"><span class="label">Email</span><span class="val">${vendor.email}</span></div>
        <div class="detail-row"><span class="label">Address</span><span class="val">${vendor.address}</span></div>
        <div class="detail-row"><span class="label">Verification</span><span class="val">${statusBadge(vendor.verification_status)}</span></div>
        ${vendor.verification_status === 'pending' ? `<div style="display:flex;gap:8px;margin:8px 0">
          <button style="background:var(--success);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600" onclick="verifyVendor('${vendor.vendor_id}','verify')">Confirm Vendor</button>
          <button style="background:var(--danger);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600" onclick="verifyVendor('${vendor.vendor_id}','reject')">Reject Vendor</button>
        </div>` : ''}
        <div class="detail-row"><span class="label">Rating</span><span class="val">${vendor.rating} (${vendor.rating_count} reviews)</span></div>
        <div class="detail-row"><span class="label">FSSAI</span><span class="val">${vendor.fssai_number}</span></div>
        <div class="detail-row"><span class="label">Coordinates</span><span class="val" style="font-family:monospace">${vendor.latitude}, ${vendor.longitude}</span></div>
      </div>

      <div class="detail-card">
        <h4>Demand Forecast (ML)</h4>
        <div class="ml-box">
          <div class="ml-grid">
            <div class="ml-item"><div class="ml-val">${forecast.predictedDemand}</div><div class="ml-label">Predicted Demand</div></div>
            <div class="ml-item"><div class="ml-val">${forecast.recommendedDispatch}</div><div class="ml-label">Recommended Dispatch</div></div>
            <div class="ml-item"><div class="ml-val">${forecast.currentStock}</div><div class="ml-label">Current Stock</div></div>
            <div class="ml-item"><div class="ml-val">${forecast.minimumStock}</div><div class="ml-label">Minimum Stock</div></div>
          </div>
          <div style="margin-top:12px;font-size:12px;color:var(--muted)">
            Historical Sales: ${forecast.historicalSales} units | Recent Orders: ${forecast.recentOrders} | Source: ${forecast.dataSource}
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Inventory (${inventory.length} items)</h3></div>
      <table>
        <thead><tr><th>Product</th><th>Batch</th><th>Qty</th><th>Min Stock</th><th>Status</th><th>Price</th><th>Manufactured</th><th>Expiry</th><th>Freshness</th><th>Spoilage</th></tr></thead>
        <tbody>
          ${inventory.map(i => {
            const lowStock = i.quantity <= i.minimum_stock;
            const fs = i.freshness_score || 0;
            return `<tr>
              <td><strong>${i.product_name}</strong></td>
              <td>${i.batch_number}</td>
              <td>${i.quantity}</td>
              <td>${i.minimum_stock}</td>
              <td>${lowStock ? '<span class="badge badge-high">LOW STOCK</span>' : '<span class="badge badge-low">IN STOCK</span>'}</td>
              <td>₹${i.price}</td>
              <td>${fmtDate(i.manufacture_date)}</td>
              <td>${fmtDate(i.expiry_date)}</td>
              <td>${(fs*100).toFixed(0)}% ${freshnessBar(fs)}</td>
              <td>${freshnessBadge(fs)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-header"><h3>Delivery Orders (${ordersWithItems.length})</h3></div>
      <table>
        <thead><tr><th>Order ID</th><th>Date</th><th>Amount</th><th>Payment</th><th>Status</th><th>Delivery Address</th></tr></thead>
        <tbody>
          ${ordersWithItems.map(o => `<tr>
            <td><strong>${o.order_id}</strong></td>
            <td>${fmt(o.order_date)}</td>
            <td>₹${o.total_amount}</td>
            <td>${statusBadge(o.payment_status)} ${o.payment_method}</td>
            <td>${statusBadge(o.order_status)}</td>
            <td>${o.delivery_address || '-'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-header"><h3>Delivery Items</h3></div>
      <table>
        <thead><tr><th>Order</th><th>Inventory ID</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th><th>Delivery Address</th></tr></thead>
        <tbody>
          ${ordersWithItems.flatMap(o => (o.items || []).map(item => {
            const inv = inventory.find(i => i.inventory_id === item.inventory_id) || {};
            return `<tr>
              <td><strong>${o.order_id}</strong></td>
              <td>${item.inventory_id}</td>
              <td>${inv.product_name || item.inventory_id}</td>
              <td>${item.quantity}</td>
              <td>₹${item.unit_price}</td>
              <td>₹${item.subtotal}</td>
              <td>${o.delivery_address || '-'}</td>
            </tr>`;
          })).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════
// ORDERS
// ════════════════════════════════════════════════════════════════
async function loadOrders() {
  const orders = await api('/api/orders');
  document.getElementById('content').innerHTML = `
    <div class="filters">
      <input id="order-search" placeholder="Search orders..." oninput="filterOrders()">
      <select id="order-status-filter" onchange="filterOrders()">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="preparing">Preparing</option>
        <option value="out_for_delivery">Out for Delivery</option>
        <option value="delivered">Delivered</option>
      </select>
      <select id="order-payment-filter" onchange="filterOrders()">
        <option value="">All Payment</option>
        <option value="paid">Paid</option>
        <option value="pending">Pending</option>
      </select>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Order ID</th><th>Customer</th><th>Vendor</th><th>Date</th><th>Amount</th><th>Payment</th><th>Status</th><th>Type</th><th>Action</th></tr></thead>
        <tbody id="orders-tbody">
          ${orders.map(o => `<tr data-search="${(o.order_id+' '+o.user_id+' '+o.vendor_id+' '+o.delivery_address).toLowerCase()}" data-status="${o.order_status}" data-payment="${o.payment_status}">
            <td><strong>${o.order_id}</strong></td>
            <td>${o.user_id}</td>
            <td>${o.vendor_id}</td>
            <td>${fmt(o.order_date)}</td>
            <td>₹${o.total_amount}</td>
            <td>${statusBadge(o.payment_status)} ${o.payment_method}</td>
            <td>${statusBadge(o.order_status)}</td>
            <td>${o.delivery_type}</td>
            <td><button class="btn btn-sm" style="background:var(--info);color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px" onclick="showOrderDetail('${o.order_id}')">View</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function filterOrders() {
  const q = document.getElementById('order-search').value.toLowerCase();
  const s = document.getElementById('order-status-filter').value;
  const p = document.getElementById('order-payment-filter').value;
  document.querySelectorAll('#orders-tbody tr').forEach(tr => {
    const match = (!q || tr.dataset.search.includes(q)) && (!s || tr.dataset.status === s) && (!p || tr.dataset.payment === p);
    tr.style.display = match ? '' : 'none';
  });
}

async function showOrderDetail(orderId) {
  const o = await api('/api/orders/' + orderId);
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal" style="position:relative">
        <button class="close" onclick="this.closest('.modal-overlay').remove()">x</button>
        <h3>Order ${o.order_id}</h3>
        <div class="detail-row"><span class="label">Customer</span><span class="val">${o.user_id}</span></div>
        <div class="detail-row"><span class="label">Vendor</span><span class="val">${o.vendor_id}</span></div>
        <div class="detail-row"><span class="label">Date</span><span class="val">${fmt(o.order_date)}</span></div>
        <div class="detail-row"><span class="label">Total</span><span class="val">₹${o.total_amount}</span></div>
        <div class="detail-row"><span class="label">Payment</span><span class="val">${statusBadge(o.payment_status)} ${o.payment_method}</span></div>
        <div class="detail-row"><span class="label">Status</span><span class="val">${statusBadge(o.order_status)}</span></div>
        <div class="detail-row"><span class="label">Delivery</span><span class="val">${o.delivery_type} ${o.delivery_address || ''}</span></div>
        ${o.items && o.items.length ? `
          <h4 style="margin:16px 0 8px;font-size:14px">Order Items</h4>
          <table>
            <thead><tr><th>Inventory</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr></thead>
            <tbody>${o.items.map(i => `<tr><td>${i.inventory_id}</td><td>${i.quantity}</td><td>₹${i.unit_price}</td><td>₹${i.subtotal}</td></tr>`).join('')}</tbody>
          </table>
        ` : '<p style="margin-top:12px;color:var(--muted);font-size:13px">No order items found</p>'}
      </div>
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════
// INVENTORY
// ════════════════════════════════════════════════════════════════
async function loadInventory() {
  const items = await api('/api/inventory');
  document.getElementById('content').innerHTML = `
    <div class="card">
      <table>
        <thead><tr><th>ID</th><th>Vendor</th><th>Product</th><th>Batch</th><th>Qty</th><th>Min Stock</th><th>Status</th><th>Price</th><th>Manufactured</th><th>Expiry</th><th>Freshness</th><th>Risk</th><th>Action</th></tr></thead>
        <tbody>
          ${items.map(i => {
            const lowStock = i.quantity <= i.minimum_stock;
            const fs = i.freshness_score || 0;
            return `<tr>
              <td>${i.inventory_id}</td>
              <td>${i.vendor_id}</td>
              <td><strong>${i.product_name}</strong></td>
              <td>${i.batch_number}</td>
              <td>${i.quantity}</td>
              <td>${i.minimum_stock}</td>
              <td>${lowStock ? '<span class="badge badge-high">LOW STOCK</span>' : '<span class="badge badge-low">IN STOCK</span>'}</td>
              <td>₹${i.price}</td>
              <td>${fmtDate(i.manufacture_date)}</td>
              <td>${fmtDate(i.expiry_date)}</td>
              <td>${(fs*100).toFixed(0)}% ${freshnessBar(fs)}</td>
              <td>${freshnessBadge(fs)}</td>
              <td><button class="btn btn-sm" style="background:var(--info);color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px" onclick="showSpoilageRisk('${i.inventory_id}')">ML Risk</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function showSpoilageRisk(invId) {
  const d = await api('/api/inventory/' + invId + '/spoilage-risk');
  const riskCls = d.mlRiskLabel === 'Low' ? 'risk-low' : d.mlRiskLabel === 'Medium' ? 'risk-medium' : 'risk-high';
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal" style="position:relative">
        <button class="close" onclick="this.closest('.modal-overlay').remove()">x</button>
        <h3>Spoilage Risk - ${d.productId}</h3>
        <div class="ml-box">
          <div class="ml-grid">
            <div class="ml-item ${riskCls}"><div class="ml-val">${d.mlRiskLabel}</div><div class="ml-label">ML Risk Level</div></div>
            <div class="ml-item"><div class="ml-val">${d.mlConfidence}%</div><div class="ml-label">Confidence</div></div>
            <div class="ml-item"><div class="ml-val">${(d.freshnessScore*100).toFixed(0)}%</div><div class="ml-label">Freshness Score</div></div>
            <div class="ml-item"><div class="ml-val">${d.freshnessRisk}</div><div class="ml-label">Freshness Risk</div></div>
          </div>
          <div style="margin-top:12px">
            ${Object.entries(d.mlProbabilities).map(([k,v]) => `<span class="badge badge-${k.toLowerCase()}" style="margin-right:6px">${k}: ${v}%</span>`).join('')}
          </div>
        </div>
        <div class="detail-row"><span class="label">Batch</span><span class="val">${d.batchNumber}</span></div>
        <div class="detail-row"><span class="label">Manufactured</span><span class="val">${fmtDate(d.manufactureDate)}</span></div>
        <div class="detail-row"><span class="label">Expires</span><span class="val">${fmtDate(d.expiryDate)}</span></div>
        <div class="detail-row"><span class="label">Hours Since Manufacture</span><span class="val">${d.hoursSinceManufacture}h</span></div>
        <div class="detail-row"><span class="label">Hours to Expiry</span><span class="val">${d.hoursToExpiry}h</span></div>
        <div style="margin-top:12px;font-size:11px;color:var(--muted)">Source: ${d.dataSource}</div>
      </div>
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════
// ALERTS
// ════════════════════════════════════════════════════════════════
async function loadAlerts() {
  const alerts = await api('/api/alerts');
  document.getElementById('content').innerHTML = `
    <div class="filters">
      <select id="alert-type-filter" onchange="filterAlerts()">
        <option value="">All Types</option>
        <option value="low_stock">Low Stock</option>
        <option value="spoilage_risk">Spoilage Risk</option>
        <option value="expiry_warning">Expiry Warning</option>
      </select>
      <select id="alert-status-filter" onchange="filterAlerts()">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="acknowledged">Acknowledged</option>
        <option value="resolved">Resolved</option>
      </select>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Alert ID</th><th>Inventory</th><th>Type</th><th>Message</th><th>Status</th><th>Time</th><th>Inventory Item</th></tr></thead>
        <tbody id="alerts-tbody">
          ${alerts.map(a => {
            const inv = a.inventory || {};
            return `<tr data-type="${a.alert_type}" data-status="${a.alert_status}">
              <td><strong>${a.alert_id}</strong></td>
              <td>${a.inventory_id}</td>
              <td>${a.alert_type === 'low_stock' ? '<span class="badge badge-high">LOW STOCK</span>' : a.alert_type === 'spoilage_risk' ? '<span class="badge badge-medium">SPOILAGE</span>' : '<span class="badge badge-pending">EXPIRY</span>'}</td>
              <td>${a.alert_message}</td>
              <td>${statusBadge(a.alert_status)}</td>
              <td>${fmt(a.generated_time)}</td>
              <td>${inv.product_name || '-'} (${inv.quantity || '-'} units, ${(inv.freshness_score*100||0).toFixed(0)}% fresh)</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function filterAlerts() {
  const t = document.getElementById('alert-type-filter').value;
  const s = document.getElementById('alert-status-filter').value;
  document.querySelectorAll('#alerts-tbody tr').forEach(tr => {
    const match = (!t || tr.dataset.type === t) && (!s || tr.dataset.status === s);
    tr.style.display = match ? '' : 'none';
  });
}

// ════════════════════════════════════════════════════════════════
// AI PREDICTIONS
// ════════════════════════════════════════════════════════════════
async function loadPredictions() {
  const vendors = await api('/api/vendors');
  document.getElementById('content').innerHTML = `
    <div class="card" style="margin-bottom:20px">
      <div class="card-header"><h3>Demand Forecast by Vendor</h3></div>
      <table>
        <thead><tr><th>Vendor</th><th>Shop</th><th>Predicted Demand</th><th>Recommended Dispatch</th><th>Current Stock</th><th>Min Stock</th><th>Historical Sales</th><th>Source</th></tr></thead>
        <tbody id="forecast-tbody">
          ${vendors.map(v => `<tr><td>${v.vendor_id}</td><td>${v.shop_name}</td><td colspan="6"><button class="btn btn-sm" style="background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600" onclick="loadForecast('${v.vendor_id}',this)">Run Forecast</button></td></tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-header"><h3>Spoilage Risk by Inventory</h3></div>
      <table>
        <thead><tr><th>Inventory</th><th>Product</th><th>Vendor</th><th>Freshness</th><th>Action</th></tr></thead>
        <tbody>
          ${(await api('/api/inventory')).map(i => `<tr>
            <td>${i.inventory_id}</td>
            <td><strong>${i.product_name}</strong></td>
            <td>${i.vendor_id}</td>
            <td>${(i.freshness_score*100).toFixed(0)}% ${freshnessBar(i.freshness_score)}</td>
            <td><button class="btn btn-sm" style="background:var(--info);color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px" onclick="showSpoilageRisk('${i.inventory_id}')">Run ML Risk</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function loadForecast(vendorId, btn) {
  btn.textContent = 'Loading...';
  btn.disabled = true;
  try {
    const d = await api('/api/vendors/' + vendorId + '/demand-forecast');
    const tr = btn.closest('tr');
    tr.innerHTML = `<td>${d.vendorId}</td><td>${d.shopName}</td>
      <td><strong style="font-size:16px;color:var(--accent)">${d.predictedDemand}</strong></td>
      <td><strong>${d.recommendedDispatch}</strong></td>
      <td>${d.currentStock}</td>
      <td>${d.minimumStock}</td>
      <td>${d.historicalSales} units (${d.recentOrders} orders)</td>
      <td style="font-size:11px;color:var(--muted)">${d.dataSource}</td>`;
  } catch(e) {
    btn.textContent = 'Error'; toast(e.message, 'error');
  }
}

// ════════════════════════════════════════════════════════════════
// RECOMMENDATIONS
// ════════════════════════════════════════════════════════════════
async function loadRecommendations() {
  const recs = await api('/api/recommendations');
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-header"><h3>Vendor Recommendations</h3></div>
      <table>
        <thead><tr><th>Rank</th><th>Vendor</th><th>Distance (km)</th><th>Stock Score</th><th>Freshness Score</th><th>Rating Score</th></tr></thead>
        <tbody>
          ${recs.map(r => `<tr>
            <td><strong>#${r.recommendation_rank}</strong></td>
            <td>${r.vendor_name || r.vendor_id}</td>
            <td>${r.distance} km</td>
            <td>${(r.stock_score * 100).toFixed(0)}%</td>
            <td>${(r.freshness_score * 100).toFixed(0)}%</td>
            <td>${(r.rating_score * 100).toFixed(0)}%</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
async function init() {
  try {
    await api('/api/dashboard');
    document.getElementById('db-status').textContent = 'MongoDB Connected';
  } catch(e) {
    document.getElementById('db-status').textContent = 'DB Error';
    document.getElementById('db-status').style.background = 'var(--danger)';
  }
  loadDashboard();
}
init();
</script>
</body>
